<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Prevents character rendering issues across HTTP servers -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper mobile scaling -->
    <title>🧮 Orion's Calculator</title>

    <link rel="stylesheet" href="style.css">
    
    <!-- 'defer' ensures JS loads in the background and executes AFTER HTML parsing completes -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Outer display handles scroll/border; inner span handles flex text alignment -->
    <div class="calculator-display" id="display">
        <span class="display-text"></span>
    </div>

    <!-- Event delegation parent for calculator keypress clicks -->
    <div class="calculator-buttons">
        <!-- Row 1 -->
        <button value="7" id="btn7">7</button>
        <button value="8" id="btn8">8</button>
        <button value="9" id="btn9">9</button>
        <button value="+" id="btnAdd" class="btn-operator">+</button>

        <!-- Row 2 -->
        <button value="4" id="btn4">4</button>
        <button value="5" id="btn5">5</button>
        <button value="6" id="btn6">6</button>
        <button value="-" id="btnSubtract" class="btn-operator">-</button>

        <!-- Row 3 -->
        <button value="1" id="btn1">1</button>
        <button value="2" id="btn2">2</button>
        <button value="3" id="btn3">3</button>
        <button value="×" id="btnMultiply" class="btn-operator">×</button>

        <!-- Row 4 -->
        <button value="0" id="btn0">0</button>
        <button value="." id="btnDecimal">.</button>
        <button value="=" id="btnEquals" class="btn-action">=</button>
        <button value="÷" id="btnDivide" class="btn-operator">÷</button>

        <!-- Row 5 -->
        <button value="(" id="btnP1">(</button>
        <button value=")" id="btnP2">)</button>
        <button value="Backspace" id="btnBackspace" class="btn-action btn-large-text">⌫</button>
        <button value="C" id="btnC" class="btn-action">C</button>
    </div>

</body>
</html>
