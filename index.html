<!DOCTYPE html>
<html>
<head>
    <title>Page Title: Calculator App</title>
    <link rel="stylesheet" href="style.css"> <!--Link to the stylesheet in <head>-->
    <script src="script.js" defer></script> <!--Link to the script in <head>-->
    <!-- The defer keyword makes sure the script is executed after the HTML is parsed -->
</head>
<body>
    <h1>Calculator (h1)</h1>
    <div class="calculator-display">  
        0
    </div>
    <div class="calculator-buttons">
        <button value="1" id="btn1">1</button>
        <button value="2" id="btn2">2</button>
        <button value="3" id="btn3">3</button>
        <button value="+" id="btnAdd">+</button>
        <button value="4" id="btn4">4</button>
        <button value="5" id="btn5">5</button>
        <button value="6" id="btn6">6</button>
        <button value="-" id="btnSubtract">-</button>
        <button value="7" id="btn7">7</button>
        <button value="8" id="btn8">8</button>
        <button value="9" id="btn9">9</button>
        <button value="*" id="btnMultiply">*</button>
        <button value="C" id="btnC">C</button>
        <button value="0" id="btn0">0</button>
        <button value="=" id="btnEquals">=</button>
        <button value="/" id="btnDivide">/</button>
    </div>
</body>
</html>
